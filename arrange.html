<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FiFi4000 arranger</title>
<style>
  :root { --blue: #006AA7; --deep: #0B2A55; --edge: #04406A; --yellow: #FECC02; --fefe: #FEFE40; --white: #FFFFFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B2A55; color: var(--white); font: 600 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; }
  .heads { display: flex; align-items: center; gap: 6px; background: var(--white); color: var(--deep); border: 2px solid var(--edge); border-radius: 10px; padding: 3px 10px; box-shadow: 0 2px 0 var(--edge); }
  .heads input { width: 100px; margin: 0; accent-color: var(--blue); }
  #heads-val { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  /* a checkerboard behind the stage, so it's clear the background is see-through */
  #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; background: repeating-conic-gradient(#173A69 0 25%, #12305A 0 50%) 0 0 / 28px 28px; }
  button { font: inherit; cursor: pointer; border: 2px solid var(--edge); border-radius: 10px; background: var(--white); color: var(--deep); padding: 7px 12px; box-shadow: 0 2px 0 var(--edge); }
  button.go { background: var(--yellow); }
  button.on { background: var(--fefe); }
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: linear-gradient(#0B2A55, rgba(11, 42, 85, 0)); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .logo { font-size: 20px; font-weight: 800; background: var(--fefe); color: var(--deep); padding: 4px 10px; border-radius: 8px; }
  #status { flex: 1 1 200px; min-width: 0; opacity: 0.9; pointer-events: none; }
  .panel { position: fixed; left: 16px; right: 16px; max-width: 560px; margin: 0 auto; background: var(--blue); border: 2px solid var(--edge); border-radius: 12px; padding: 12px; box-shadow: 0 4px 0 var(--edge); }
  .panel[hidden] { display: none; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin: 4px 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel h2 span { text-transform: none; letter-spacing: 0; font-weight: 600; opacity: 0.85; flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips button { padding: 5px 10px; border-radius: 16px; box-shadow: none; }
  #add-guests button:not(.on) { background: transparent; color: var(--white); border-color: rgba(255, 255, 255, 0.45); text-decoration: line-through; opacity: 0.8; }
  #add, #scenes { top: calc(var(--bar, 58px) + 4px); max-height: calc(100% - var(--bar, 58px) - 24px); overflow-y: auto; }
  .scene { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.2); }
  .scene button:first-child { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scene span { font-weight: 500; font-size: 12px; opacity: 0.8; white-space: nowrap; }
  #scene-list { margin: 10px 0; }
  #scene-list:empty { display: none; }
  input[type=text] { font: inherit; flex: 1; min-width: 0; border: 2px solid var(--edge); border-radius: 10px; padding: 7px 10px; color: var(--deep); }
  #sel { bottom: max(16px, env(safe-area-inset-bottom)); }
  #sel-name { font-size: 16px; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .small { padding: 5px 9px; }
</style>
</head>
<body>
<canvas id="view" aria-label="The stage: tap someone to pose them, drag to move them, drag the empty stage to turn the view"></canvas>
<div class="bar">
  <span class="logo">FiFi4000</span>
  <button type="button" id="add-btn">People &amp; things</button>
  <button type="button" id="scenes-btn">Scenes</button>
  <button type="button" id="stage-btn">Amphitheater</button>
  <button type="button" id="play-btn">▶ Play</button>
  <label class="heads">Heads <input type="range" id="heads" min="100" max="200" step="5" value="100"><span id="heads-val">100%</span></label>
  <button type="button" id="frame-btn">Fit</button>
  <button type="button" id="view-btn">Front view</button>
  <button type="button" id="reset-btn">Start again</button>
  <button type="button" class="go" id="save-btn">Save PNG</button>
  <span id="status"></span>
</div>
<div class="panel" id="add" hidden>
  <h2>People <span id="add-count"></span><button type="button" class="small" data-all="1">Everyone in</button><button type="button" class="small" data-all="0">Everyone out</button></h2>
  <div class="chips" id="add-guests"></div>
  <h2>Add things</h2>
  <div class="chips" id="add-things"></div>
</div>
<div class="panel" id="scenes" hidden>
  <h2>Scenes</h2>
  <div class="row"><input type="text" id="scene-name" maxlength="40" autocomplete="off" aria-label="Scene name"><button type="button" class="go" id="scene-save">Save scene</button></div>
  <div id="scene-list"></div>
  <div class="row">
    <button type="button" class="small" id="scene-download">Download scene file</button>
    <button type="button" class="small" id="scene-open">Open scene file…</button>
    <input type="file" id="scene-file" accept=".json,application/json" hidden>
  </div>
</div>
<div class="panel" id="sel" hidden>
  <div id="sel-name"></div>
  <div class="chips" id="sel-poses"></div>
  <div class="row"><button type="button" id="sel-seat" class="small">Put in a seat…</button></div>
  <div class="row" id="sel-move">
    <button type="button" class="small" id="sel-left" aria-label="Turn left">⟲ Turn</button>
    <button type="button" class="small" id="sel-right" aria-label="Turn right">Turn ⟳</button>
    <button type="button" class="small" id="sel-smaller">Smaller</button>
    <button type="button" class="small" id="sel-bigger">Bigger</button>
    <button type="button" class="small" id="sel-down">Lower</button>
    <button type="button" class="small" id="sel-up">Raise</button>
    <button type="button" class="small" id="sel-remove">Remove</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="avatar.js?v=202610042218"></script>
<script src="outfits-hd.js?v=202610042218"></script>
<script src="arrange.js?v=202610042218"></script>
</body>
</html>
